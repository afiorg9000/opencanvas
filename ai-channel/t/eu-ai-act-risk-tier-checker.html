<!--
Copy rewritten in house voice, 3 Nov 2026.
Dates and duties updated for Regulation (EU) 2026/1744 ("Digital Omnibus on AI"), 4 Nov 2026.
TOOL: What Risk Tier Is Your AI System Under the EU AI Act?
FILE: eu-ai-act-risk-tier-checker.html
AUDIENCE: Executives, Business, Government (public bodies get extra duties shown: FRIA, registration, Art. 111(2)),
  Technical teams. Events report audience "government" when "A public body" is chosen, otherwise "business".

WHAT IT DOES: "Answer a few questions about how your AI system is used. We'll classify it as prohibited, high-risk,
  limited-risk or minimal-risk, then hand you the obligations and a readiness checklist. Everything runs in your
  browser. No data leaves your device." Seven-step decision tree that follows the Act: (1) role, organisation type,
  EU connection, scope exclusions (Art. 2); (2) prohibited practices (Art. 5); (3) Annex I regulated products
  (Art. 6(1)); (4) Annex III use areas (Art. 6(2)); (5) Art. 6(3) exception incl. profiling rule (only shown if an
  Annex III use is ticked); (6) Art. 50 transparency triggers; (7) general-purpose AI model provider (separate note,
  Arts. 53–55). Result: tier ladder, reasons, open questions created by "Not sure" answers, Article 4 AI literacy
  note (always shown), role-specific obligations, transparency duties, GPAI note, timeline (as amended by
  Regulation (EU) 2026/1744, with a "check the consolidated text" note), interactive readiness checklist (printable), one next step, one solution step (matchUrl: compliance
  support from members; for minimal-risk results the honest answer is "you probably don't need compliance help",
  and the solution step becomes coursesUrl for AI literacy), "Email me my results", newsletter link.
  Prominent "guidance, not legal advice" notice on intro and result.

DATA / SOURCES (as of November 2026): Regulation (EU) 2024/1689 (AI Act, OJ 12 July 2024) as amended by
  Regulation (EU) 2026/1744 of 8 July 2026 ("Digital Omnibus on AI", OJ L 24 July 2026, in force 27 July 2026;
  http://data.europa.eu/eli/reg/2026/1744/oj): Arts. 2, 4, 5, 6, 9–17, 22–27, 43, 47–55, 72, 73, 86, 95, 99,
  111, 113; Annexes I and III. Application dates as amended: 2 Feb 2025 (Art. 4, Art. 5 original bans),
  2 Aug 2025 (GPAI, penalties, governance), 2 Aug 2026 (Art. 50 and remaining general rules), 2 Dec 2026 (new
  Art. 5(1)(ba)/(bb) bans on non-consensual intimate material and CSAM; Art. 50(2) marking deadline for
  generative systems already on the market before 2 Aug 2026, Art. 111(4)), 2 Aug 2027 (legacy GPAI models),
  2 Dec 2027 (high-risk, Annex III / Art. 6(2), Art. 113(c)(i)), 2 Aug 2028 (high-risk, Annex I / Art. 6(1),
  Art. 113(c)(ii)). Art. 4 still binds providers and deployers but now reads "take measures to support the
  development of AI literacy" and no longer requires any specific level; Commission and Member States must
  support them (Art. 4(2)). Art. 99: SMCs get the "whichever is lower" fine cap (Art. 99(6a)). Commission
  guidelines on prohibited practices (Feb 2025) and on GPAI models (July 2025); GPAI Code of Practice (July 2025).
  Re-check against the EUR-Lex consolidated text when it is published or further amended.

PRIVACY: Runs entirely in the browser. No network requests, cookies or storage.

HOW TO EMBED IN WORDPRESS:
  Option A — Custom HTML block: paste everything between AIC:START and AIC:END below (style + div + script).
    CSS is scoped to .aic-tool, classes prefixed aic-, JS in an IIFE.
  Option B — iframe: <iframe src="/path/eu-ai-act-risk-tier-checker.html" title="EU AI Act risk tier checker"
    style="width:100%;min-height:1100px;border:0" loading="lazy"></iframe>

CONFIG URLS TO SET (window.AICHANNEL_CONFIG):
  matchUrl       — "Get matched to someone" (compliance support from members) — main solution step
  coursesUrl     — "Learn with a member" (shown for minimal-risk results: AI literacy training)
  resultsFormUrl — "Email me my results"
  newsletterUrl  — separate newsletter opt-in
  CTA query params: lead_type, audience, source_page, source_content_or_tool, cta_clicked, assessment_name,
  assessment_result (tier label), plus utm_* from the page URL. No numeric score for this tool.

TRACKING: 'aichannel:event' CustomEvent + parent.postMessage for tool_started, tool_completed, result_viewed,
  cta_clicked.

      : r.tier === 'minimal' ? 'Record the classification and the date in your AI inventory, then repeat this check for your next system.'
      : 'Print this page, attach it to the system\'s record, and assign an owner to each checklist item.';

    html += '<div class="aic-next" style="margin-top:26px">' +
      '<div class="aic-card"><span class="aic-eyebrow">Do this first</span><p>' + esc(step) + '</p><button type="button" class="aic-btn aic-noprint" data-act="print">Print or save as PDF</button></div>' +
      (heavy ? '<div class="aic-card aic-solution"><span class="aic-eyebrow">If you want help</span><h3 class="aic-h3">Get matched to compliance support</h3><p class="aic-soft">' + esc(reason) + '</p><a class="aic-btn aic-btn-primary aic-noprint" data-aic-cta="get_matched" data-aic-url="matchUrl" target="_blank" rel="noopener">Get matched to someone</a></div>'
        : '<div class="aic-card aic-solution"><span class="aic-eyebrow">If you want help</span><h3 class="aic-h3">' + (r.tier === 'limited' ? 'Get matched to compliance support' : 'You probably don\'t need compliance help for this one') + '</h3><p class="aic-soft">' + (r.tier === 'limited' ? 'Transparency duties are usually manageable in-house. If you run several AI systems, a member who supports AI Act compliance can help you check them all and set up disclosure once.' : 'For a minimal-risk system, the useful investment is AI literacy for the people using it, which the Act requires anyway. Members run short, practical courses.') + '</p>' +
          (r.tier === 'limited' ? '<a class="aic-btn aic-btn-primary aic-noprint" data-aic-cta="get_matched" data-aic-url="matchUrl" target="_blank" rel="noopener">Get matched to someone</a>' : '<a class="aic-btn aic-btn-primary aic-noprint" data-aic-cta="learn_with_member" data-aic-url="coursesUrl" target="_blank" rel="noopener">Learn with a member</a>') + '</div>') +
      '</div>' +
      '<div class="aic-handoff aic-noprint"><a data-aic-cta="email_results" data-aic-url="resultsFormUrl" target="_blank" rel="noopener">Email me my results</a><a data-aic-cta="newsletter" data-aic-url="newsletterUrl" target="_blank" rel="noopener">Newsletter: keep up without keeping up with everything</a><button type="button" class="aic-linkbtn" data-act="restart">Check another system</button></div>';

    html += '<div class="aic-note aic-warn" style="margin-top:22px"><strong>Guidance, not legal advice.</strong> This simplifies the AI Act (Regulation (EU) 2024/1689) as amended by Regulation (EU) 2026/1744; check the official consolidated text. It doesn\'t cover every condition, exception or national rule. Take legal advice before relying on a result, especially a prohibited or high-risk one.</div>' +
      '<p class="aic-sources" style="margin-top:12px">Sources: Regulation (EU) 2024/1689, Articles 2, 4, 5, 6, 9–17, 22–27, 43, 47–55, 72, 73, 86, 95, 99, 111, 113 and Annexes I and III, as amended by Regulation (EU) 2026/1744 of 8 July 2026 (Official Journal, 24 July 2026); European Commission guidelines on prohibited practices (February 2025) and on general-purpose AI models (July 2025); General-Purpose AI Code of Practice (July 2025). As of November 2026.</p>';
    html += '</div>';
    var host = $('[data-screen="results"]');
    host.setAttribute('aria-labelledby', 'aic-eu-rh');
    host.innerHTML = html;
    wireCtas(host, info);
    updateChecklistCount();
    emit('tool_completed', { assessment_result: info.label });
    emit('result_viewed', { assessment_result: info.label });
  }
  function updateChecklistCount() {
    var boxes = $$('.aic-eu-chk input'), n = boxes.filter(function (b) { return b.checked; }).length;
    var el = $('#aic-eu-count'); if (el) el.textContent = n + ' of ' + boxes.length + ' done';
  }

})();
</script>
