  Four short steps: industry (8 options), team size (5 bands), the kinds of work that eat the week (12, tick

  likely payoff against risk, each with: what it looks like in practice; what to watch (data, accuracy, who

  matchUrl when the picks carry high risk, the team is 50+, or the picks involve connecting company documents or
  data (team 10+); coursesUrl otherwise. Then "Email me my results" and a separate newsletter link.

  METHOD (editorial judgment, not measurement)
  Each use has a base payoff and risk rating (1-5), adjusted by industry and team size (tables PAYOFF/RISK,

  ticked, the list is topped up with common starting points for that industry, marked "Not on your list".
  Ratings are shown as High / Medium / Low labels only. No invented figures.

  }

  function chartSvg(top) {
    /* Plot area x 40..322, y 24..224. Quadrant splits: risk 2.5, payoff 3.5 (matches "Strong first pick"). */
    function X(r) { return 40 + (r - 0.5) / 5 * 282; }
    function Y(p) { return 224 - (p - 0.5) / 5 * 200; }
    var seen = {}, dots = '';
    top.forEach(function (x, i) {
      var key = x.p + '|' + x.r, k = seen[key] || 0; seen[key] = k + 1;
      var cx = X(x.r) + (k === 0 ? 0 : (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 22), cy = Y(x.p);
      dots += '<g><circle cx="' + cx + '" cy="' + cy + '" r="11" fill="' + (x.sugg ? 'var(--aic-white)' : 'var(--aic-blue)') + '" stroke="var(--aic-blue)" stroke-width="2"/>' +
        '<text x="' + cx + '" y="' + (cy + 4.5) + '" text-anchor="middle" font-size="12" font-weight="800" fill="' + (x.sugg ? 'var(--aic-blue)' : 'var(--aic-on-blue)') + '">' + (i + 1) + '</text></g>';
    });
    var desc = top.map(function (x, i) { return (i + 1) + ': ' + x.w.short + ', payoff ' + lvl(x.p).toLowerCase() + ', risk ' + lvl(x.r).toLowerCase(); }).join('; ');
    return '<svg viewBox="0 0 330 270" role="img" aria-label="Payoff against risk for your starting points. ' + esc(desc) + '">' +
      '<rect x="40" y="24" width="112" height="79" rx="10" fill="var(--aic-green-soft)"/>' +
      '<rect x="154" y="24" width="168" height="79" rx="10" fill="var(--aic-amber-soft)"/>' +
      '<rect x="40" y="105" width="112" height="119" rx="10" fill="var(--aic-sage)"/>' +
      '<rect x="154" y="105" width="168" height="119" rx="10" fill="var(--aic-sage)" opacity=".6"/>' +
      '<text x="44" y="16" font-size="11" font-weight="800" fill="var(--aic-green)">START HERE</text>' +
      '<text x="318" y="16" font-size="11" font-weight="800" fill="var(--aic-amber)" text-anchor="end">WORTH IT, WITH CHECKS</text>' +
      '<text x="44" y="240" font-size="11" font-weight="800" fill="var(--aic-soft)">SMALL WINS</text>' +
      '<text x="318" y="240" font-size="11" font-weight="800" fill="var(--aic-soft)" text-anchor="end">LATER</text>' +
      '<text x="181" y="262" font-size="11.5" font-weight="700" fill="var(--aic-soft)" text-anchor="middle">Lower risk  →  Higher risk</text>' +
      '<text x="16" y="124" font-size="11.5" font-weight="700" fill="var(--aic-soft)" text-anchor="middle" transform="rotate(-90 16 124)">Smaller  →  Bigger payoff</text>' +
      dots + '</svg>';
  }

  function useHtml(x, i) {
    var w = x.w, b = band(x), extra = w.ind[S.ind];
    var pTone = x.p >= 4 ? 'good' : x.p === 3 ? 'blue' : '';
    var rTone = x.r >= 4 ? 'bad' : x.r === 3 ? 'warn' : 'good';
    return '<article class="aic-card aic-wh-use" aria-labelledby="aic-wh-u' + i + '">' +
      '<div class="aic-wh-top"><span class="aic-wh-rank' + (x.sugg ? ' aic-wh-sugg' : '') + '" aria-hidden="true">' + (i + 1) + '</span><div>' +
        '<h3 class="aic-h3" id="aic-wh-u' + i + '"><span class="aic-sr">' + (i + 1) + '. </span>' + esc(w.title) + '</h3>' +
        '<div class="aic-wh-tags"><span class="aic-tag aic-t-' + b.tone + '">' + b.t + '</span><span class="aic-tag aic-t-' + pTone + '">Payoff: ' + lvl(x.p) + '</span><span class="aic-tag aic-t-' + rTone + '">Risk: ' + lvl(x.r) + '</span>' +
        (x.sugg ? '<span class="aic-tag">Not on your list</span>' : '') + '</div></div></div>' +
      '<div class="aic-wh-sec"><div class="aic-wh-label">What it looks like</div><p>' + esc(w.practice) + (extra ? ' ' + esc(extra) : '') + '</p></div>' +
      '<div class="aic-wh-sec"><div class="aic-wh-label">What to watch</div><div class="aic-wh-watch">' +
        '<div><b>Data</b>' + esc(w.data) + '</div><div><b>Accuracy</b>' + esc(w.acc) + '</div><div><b>Who checks it</b>' + esc(w.check) + '</div></div></div>' +
      '<div class="aic-wh-sec aic-wh-test"><b>Run the one-task test this week.</b> ' + esc(w.test) + '</div>' +
      (w.notYet ? '<p class="aic-wh-sec aic-wh-notyet"><b>You don’t need this yet:</b> ' + esc(w.notYet) + '</p>' : '') +
      '</article>';
  }

  function chooseSolution(top) {
    var bigTeam = S.size === 'l' || S.size === 'xl';
    var risky = top.some(function (x) { return x.r >= 4; });
    var connects = top.some(function (x) { return x.w.id === 'know' || x.w.id === 'admin'; }) && S.size !== 'solo' && S.size !== 's';
    if (risky) return { cta: 'get_matched', url: 'matchUrl', lead: 'advisory', btn: 'Get matched to someone', h: 'Set it up with someone who has done it before',
      p: 'Some of your best starting points touch confidential documents, money or decisions about people. A member who advises on AI adoption can help you pick the tool, set the data rules and decide who checks what, before anyone relies on it.' };
    if (bigTeam || connects) return { cta: 'get_matched', url: 'matchUrl', lead: 'advisory', btn: 'Get matched to someone', h: 'Plan it across the team, not one person at a time',
      p: bigTeam ? 'At your size, the hard part is rolling a good test out to more people without losing control of tools and data. A member who advises on AI adoption can plan that with you.' : 'Your picks mean connecting company documents or data to an AI tool. A member who advises on AI adoption can help you set that up safely.' };
    return { cta: 'learn_with_member', url: 'coursesUrl', lead: 'training', btn: 'Learn with a member', h: 'Get your team doing this well',
      p: 'Your best starting points are everyday drafting work. A short hands-on course with a member gets people doing it on their own real tasks, and teaches them when not to trust the output.' };
  }

  function renderResult() {
    var res = compute(), top = res.top, ind = INDUSTRIES.filter(function (o) { return o.id === S.ind; })[0];
    var size = SIZES.filter(function (o) { return o.id === S.size; })[0];
    var first = top[0];
    var label = 'Start with: ' + first.w.short + ' · ' + ind.label + ' · ' + size.label;
    lastResult = { label: label, top: top, ind: ind, size: size };
    var sol = chooseSolution(top);
    var notHere = [
      'Anything that sends AI-written words to customers without a person reading them first.',
      'Anything that decides about people: hiring, credit, individual pricing, care.',
      'Buying a new tool before you’ve tested the idea on the one you already have, or on a free one with nothing confidential.'
    ];
    if (NOT_HERE[S.ind]) notHere.unshift(NOT_HERE[S.ind]);
    var forWhom = 'For ' + ind.noun + ' ' + sizePhrase();

    var html = '<div class="aic-fade">' +
      '<header class="aic-card"><span class="aic-eyebrow">Where to start</span>' +
      '<h2 class="aic-h2" id="aic-wh-rh">Start with ' + esc(first.w.short.toLowerCase()) + '.</h2>' +
      '<p class="aic-soft">' + esc(forWhom) + ', starting from the work you ticked. Ranked by likely payoff against risk. The ratings are our judgment, not a measurement; your own test is what counts.</p>' +
      '<div class="aic-wh-chart" style="margin-top:16px">' + chartSvg(top) +
        '<ol class="aic-wh-key">' + top.map(function (x, i) { return '<li><span class="aic-wh-num' + (x.sugg ? ' aic-wh-sugg' : '') + '" aria-hidden="true">' + (i + 1) + '</span><span>' + esc(x.w.short) + (x.sugg ? ' <span class="aic-small">(not on your list)</span>' : '') + '</span></li>'; }).join('') + '</ol>' +
      '</div></header>' +
      '<div class="aic-note" style="margin-top:14px">' + READY_NOTE[S.ready] + '</div>' +
      top.map(useHtml).join('') +
      (res.later.length ? '<div class="aic-card aic-wh-later"><h3 class="aic-h3">The rest of your list, for later</h3><p class="aic-small">You ticked these too. They ranked lower for now; come back to them once the first test has paid off.</p><ul>' +
        res.later.map(function (x) { return '<li><span class="aic-tag">' + esc(x.w.short) + '</span></li>'; }).join('') + '</ul></div>' : '') +
      '<div class="aic-card" style="margin-top:14px"><span class="aic-eyebrow" style="color:var(--aic-amber)">Where not to start</span>' +
        '<h3 class="aic-h3" style="margin-top:6px">Leave these until you’ve got a few tests behind you.</h3>' +
        '<ul class="aic-list aic-list-x">' + notHere.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +

      '<div class="aic-next aic-noprint" style="margin-top:14px">' +
        '<div class="aic-card"><span class="aic-eyebrow">Your next step</span><h3 class="aic-h3">Run the one-task test on number one</h3>' +
          '<p class="aic-soft">' + esc(first.w.test) + ' Same job, clock running. If it doesn’t save time on real work, you’ve learned that for the price of an afternoon.</p>' +
          '<div class="aic-actions"><button type="button" class="aic-btn" data-act="copy">Copy my plan</button><button type="button" class="aic-btn aic-btn-ghost" data-act="print">Print</button></div></div>' +
        '<div class="aic-card aic-solution"><span class="aic-eyebrow">Need more than an answer?</span><h3 class="aic-h3">' + esc(sol.h) + '</h3><p class="aic-soft">' + esc(sol.p) + '</p>' +
          '<div class="aic-actions"><a class="aic-btn aic-btn-primary" data-aic-cta="' + sol.cta + '" data-aic-url="' + sol.url + '" data-aic-lead="' + sol.lead + '" target="_blank" rel="noopener">' + sol.btn + '</a></div></div>' +
      '</div>' +
      '<div class="aic-handoff aic-noprint"><a data-aic-cta="email_results" data-aic-url="resultsFormUrl" target="_blank" rel="noopener">Email me my results</a>' +
        '<a data-aic-cta="newsletter" data-aic-url="newsletterUrl" target="_blank" rel="noopener">Keep up without keeping up with everything</a>' +
        '<button type="button" class="aic-linkbtn" data-act="edit">Change what I ticked</button><button type="button" class="aic-linkbtn" data-act="restart">Start again</button></div>' +

      '<details class="aic-more aic-card" style="margin-top:18px"><summary>How this works, and sources</summary><div class="aic-sources">' +
        '<p>Each kind of work has a payoff and a risk rating from 1 to 5, adjusted for your industry and team size, and ranked by payoff weighted twice as heavily as risk. Payoff means time likely saved on repetitive, checkable work. Risk means what happens when the output is wrong, and how sensitive the data is. These are editorial ratings, not measurements, and the result is a starting point, not advice.</p>' +
        '<p style="margin-top:8px">You’re not early. In the U.S. Chamber of Commerce’s 2025 small-business survey, 58% of small businesses said they use generative AI, up from 40% in 2024. Self-reported, and definitions vary, so treat it as a direction.</p>' +
        '<ol style="list-style:decimal;padding-left:20px;margin-top:8px">' +
          '<li>U.S. Chamber of Commerce, “U.S. Chamber’s Latest ‘Empowering Small Business’ Report Shows Majority of Businesses in All 50 States Are Embracing AI,” 18 August 2025. <a href="https://www.uschamber.com/technology/artificial-intelligence/u-s-chambers-latest-empowering-small-business-report-shows-majority-of-businesses-in-all-50-states-are-embracing-ai" target="_blank" rel="noopener">uschamber.com</a>. Full report: <a href="https://www.uschamber.com/assets/documents/Empowering-Small-Business-Report-2025.pdf" target="_blank" rel="noopener">Empowering Small Business 2025 (PDF)</a>. Checked 4 November 2026.</li>' +
          '<li>Regulation (EU) 2024/1689 (EU AI Act), Annex III, point 4(a): AI used for recruitment or selection, including to analyze and filter job applications, is high-risk. <a href="https://eur-lex.europa.eu/eli/reg/2024/1689/oj" target="_blank" rel="noopener">EUR-Lex</a>; European Commission <a href="https://ai-act-service-desk.ec.europa.eu/" target="_blank" rel="noopener">AI Act Service Desk</a>. Checked 4 November 2026.</li>' +
        '</ol>' +
        '<p style="margin-top:8px">No tool or vendor is recommended here. Everything ran in your browser; nothing was stored or sent.</p>' +
      '</div></details>' +
      '</div>';

    var host = $('#aic-wh-result');
    host.innerHTML = html;
    host.hidden = false;
    $('.aic-wh-form').hidden = true;
    ROOT.classList.add('aic-wh-has-result');
    wireCtas(host, { label: label });
    scrollToEl(ROOT);
    focusHeading($('#aic-wh-rh'));
    emit('tool_completed', { assessment_result: label, industry: S.ind, team_size: S.size, work_ticked: S.work.length, ai_today: S.ready });
    emit('result_viewed', { assessment_result: label, top_uses: top.map(function (x) { return x.w.id; }).join(',') });
  }
  function sizePhrase() {
    return { solo: 'run by one person', s: 'with 2–9 people', m: 'with 10–49 people', l: 'with 50–249 people', xl: 'with 250 people or more' }[S.size];
  }

  function copyPlan(btn) {
    if (!lastResult) return;
    var r = lastResult;
    var lines = ['Where could AI actually help your business?', r.ind.label + ' · ' + r.size.label, ''];
    r.top.forEach(function (x, i) {
      lines.push((i + 1) + '. ' + x.w.title + ' (payoff ' + lvl(x.p).toLowerCase() + ', risk ' + lvl(x.r).toLowerCase() + ')');
      lines.push('   Who checks it: ' + x.w.check);
      lines.push('   One-task test: ' + x.w.test);
      if (x.w.notYet) lines.push('   You don’t need this yet: ' + x.w.notYet);
      lines.push('');
    });
    lines.push('Made with AI Channel. A starting point, not advice.');
    var text = lines.join('\n');
    function done(ok) { btn.textContent = ok ? 'Copied' : 'Copy didn’t work: try Print'; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      else done(false);
    } catch (e) { done(false); }
  }

  renderStep(false);
})();
</script>
