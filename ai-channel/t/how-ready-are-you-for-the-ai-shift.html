<!--
  TOOL: How Ready Are You for the AI Shift?  (slug: how-ready-are-you-for-the-ai-shift)
  AUDIENCE: For You (general public). Primary tool on the For You page.
  WHAT IT DOES: 20 behavioural questions across five dimensions of personal resilience for the
    AI transition (financial resilience, AI fluency, career adaptability, information diet,
    community & wellbeing). Gives a 0-100 score, a band (Early days / Getting oriented / On your way /
    Well positioned), a per-dimension breakdown, three next steps for the weakest areas, a
    copyable prompt for an AI assistant, then one member solution step and "Email me my results".

`);return`I just took a 20-question self-assessment about personal readiness for the coming years of AI progress. I'd like your help turning my results into a concrete, realistic plan.

MY RESULTS
Overall: ${e}/100 ("${o.name}")
${r}

ABOUT THE ASSESSMENT (so you know what these numbers mean)
- It measures five dimensions of personal resilience for an AI-driven transition: financial resilience, AI fluency, career adaptability, information diet, and community & wellbeing. The framework synthesizes published personal-preparedness writing, mainly Benjamin Todd's "How can an ordinary person prepare for AGI?" (benjamintodd.substack.com), John Clark Levin's "Eleven Practical Ways to Prepare for AGI," and Nikola Jurkovic's "Orienting to 3-Year AGI Timelines" (both on LessWrong). The career questions use comparative-advantage reasoning about which work holds its value — judgment, trust, relationships, hands-on skill (see intelligence-curse.ai).
- Questions are behavioral (facts about my life), scored 0–3 from least to most resilient position. Dimension scores are percentages of the maximum; the overall score is the plain average of the five dimensions. Score bands map directly to the answer scale (e.g., below 40 = my answers averaged in the two least-resilient options).
- It is a structured reflection tool, not a validated instrument — no outcome data links these scores to how anyone actually fares. Treat my numbers as a rough mirror.

HOW I'D LIKE YOU TO HELP
1. Ask me a few clarifying questions about my actual situation (job, obligations, constraints) before advising — my scores compress a lot.
2. Then help me turn my three next steps into a specific 30-day plan with small, concrete first actions.
