<!--
  TOOL: Check Your Job  (slug: check-your-job) - full edition
  AUDIENCE: For You (individuals) and HR & Team Leads ("Which parts of your team's work could AI change first?").
  WHAT IT DOES: pick one of 65 occupations (or build your own); the tool breaks it into typical tasks, checks each
    task's usual length against the length of computer task AI agents can complete (METR's time-horizon trend),
    weights by kind of work, and shows the share of the work within AI's reach for a chosen year (2026-2032) at
    two paces. Tasks are editable. Results: exposure %, task chart, "moves that help", a job-structure note, a
    copyable prompt for an AI assistant, then one next step, one member solution step (course; team match) and
    "Email me my results". Everything runs in the browser. Nothing is stored or sent until a link is clicked.

    extends check-your-job.jsx (editable tasks, pace toggle, updated frontier snapshot). Hand-off section added.
  DATA AND SOURCES (as of dates):
    - Frontier: FROZEN SNAPSHOT, about 16 hours at ~50% reliability for the best model as of April 2026
      (metr.org/time-horizons, last updated May 2026; METR arXiv 2503.14499). Doubling ~7 months (2019-2024
      average) or ~4.3 months (pace since 2024). Everything after the snapshot is extrapolation.
      To update: change FRONTIER_ASOF, ANCHOR_YEAR and ANCHOR_HOURS in the source and rebuild, or edit the
      same constants in the minified script (search for "April 2026").
    - Anthropic labor-market research (March 2026): 94% theoretical vs ~33% observed task coverage in computer
      and math occupations; no significant unemployment rise for the most exposed workers since late 2022.
    - Stanford Digital Economy Lab, "Canaries in the Coal Mine"; Eloundou et al., "GPTs are GPTs" (arXiv 2303.10130);
