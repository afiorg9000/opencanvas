Copy rewritten in house voice, 3 Nov 2026.
Updated 4 Nov 2026 after comparison with the aidoomsdayguide.com AI Governance Control Checker (8 tick boxes, % score,
  three fixed actions). Ported its two controls this tool lacked as one new core question, "Limits on access and actions"
  (least-privilege access + human approval for irreversible actions; Monitoring and human oversight area), and folded
  three of its wordings into existing actions: revoke credentials at switch-off, a fresh approval when use changes,
  and naming applicable laws/sector rules on the approval form. Now 22 questions. Result labels, levels and scoring
  method unchanged. Omnibus note updated: Regulation (EU) 2026/1744 adopted July 2026.
TOOL: Does Your Organization Have the Controls to Govern the AI It Uses?
FILE: does-your-organization-have-the-controls-to-govern-ai.html
AUDIENCE: Government (primary tool) — public bodies of any level. Also Executives / company leadership via the
  organisation-type switch on the first screen ("Public body" / "Company"), which changes wording and examples.
  Events report audience "government" (public body) or "executives" (company).

WHAT IT DOES: A 22-question self-assessment in eight areas: ownership and inventory, approvals before go-live,
  procurement and vendor terms, evaluation and testing, logging and records, monitoring and human oversight,
  escalation and redress, shutdown and fallback. A first question on how much the organisation relies on AI
  tailors the advice (proportionality: "you don't need a heavy framework yet" for light use). Results: 0–100 score
  and level, a bar per area, top three gaps (core controls weighted first), a control-by-control action list
  (filter: needs action / all), one contextual next step, one solution step (matchUrl: governance advisory),
  "Email me my results" (resultsFormUrl) and a separate newsletter link. Printable (print stylesheet).

DATA / SOURCES (as of November 2026): No statistics are used. Control content draws on: EU AI Act, Regulation (EU)
  2024/1689, as amended by Regulation (EU) 2026/1744 (Art. 4 AI literacy, applies from 2 Feb 2025, reworded 2026
  to "take measures to support", Art. 4 hint updated 4 Nov 2026; Art. 26 deployer duties incl. logs kept at
  least six months; Art. 27 fundamental rights impact assessment; Art. 50 transparency, from 2 Aug 2026; Art. 73
  serious incidents). Note: the "Digital Omnibus on AI", Regulation (EU) 2026/1744 (8 July 2026, in force 27 July 2026), moved high-risk duties to 2 Dec 2027 / 2 Aug 2028 and changes some
  AI Act dates and duties; the tool tells users to check the official text. US OMB M-25-21 / M-25-22 (April 2025;
  Chief AI Officers, use-case inventories, acquisition). UK Algorithmic Transparency Recording Standard (ATRS).
  OECD, Governing with AI (2025). Scoring is an unvalidated orientation heuristic (each answer 0–3; "Not sure" = 0
  and flagged).

PRIVACY: Runs entirely in the browser. No network requests, cookies or storage. Nothing is sent unless the user
  clicks a CTA link (which carries the result label/score as query parameters).

    container.addEventListener('keydown', function (e) {

      if (!opt) return;
      var group = opt.closest('[role="radiogroup"]');
      var opts = $$('[role="radio"]', group);
      var i = opts.indexOf(opt), n = null;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = opts[(i + 1) % opts.length];
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = opts[(i - 1 + opts.length) % opts.length];
      if (n) { e.preventDefault(); n.focus(); onSelect(n); }
    });

  /* ---------- Tool: AI governance controls check ---------- */
  var SLUG = 'does-your-organization-have-the-controls-to-govern-ai';

  /* Each question = one control. o = four answers scored 0..3; "Not sure" is appended and scores 0 but is reported as unknown. */
  var AREAS = [
    { id: 'own', title: 'Ownership and inventory',
      why: { pub: 'You can’t govern what you haven’t listed. Audits of public bodies keep finding the same first gap: no complete record of which AI systems are in use, and no one clearly answerable for each.',
             co: 'You can’t govern what you haven’t listed. AI now arrives inside software you already pay for, so the usual first gap is an incomplete list, with no one clearly answerable for each system.' },
      qs: [
        { ctl: 'AI inventory', crit: true,
          t: 'If an auditor asked tomorrow, could you hand over one up-to-date list of the AI systems your organization uses, including AI features built into software you already buy?',
          o: ['No list exists', 'A partial list, mostly of systems IT bought', 'A list covering most systems, updated now and then', 'A maintained inventory, including embedded AI features and staff tools, reviewed on a schedule'],
          act: { pub: 'Ask every department to list each AI tool and AI feature in use (chatbots, copilots, "smart" features in case-management or HR software). For each, record owner, purpose, data used, vendor and who is affected. Public registers such as the UK Algorithmic Transparency Recording Standard (ATRS) are a good template for the fields.',
                 co: 'Ask every team lead to list each AI tool and AI feature in use (chatbots, copilots, AI features in CRM, HR or finance software). For each, record owner, purpose, data used, vendor and who is affected. Keep it in one shared place and review it quarterly.' } },
        { ctl: 'Named owner per system', crit: true,
          t: 'Does each AI system have a named owner who is accountable for how it performs and for the decisions it feeds into?',
          o: ['Nobody in particular', 'IT or the vendor, by default', 'A named owner for the main systems', 'A named business owner for every system, with written responsibilities'],
          act: 'Give every system on the inventory a named business owner (not IT, not the vendor) who signs off on its use, watches its performance and can pause it. Write the responsibilities down in five lines.' },
        { ctl: 'Senior accountability', crit: false,

          o: ['No', 'It’s discussed, but nobody is formally in charge', 'Someone is nominally responsible, with little time or authority', 'Yes — named, with a mandate, resources and a line to the top'],
          act: { pub: 'Name one senior official as accountable for AI use across the organization, with a written mandate and a regular slot with leadership. US federal agencies are required to name a Chief AI Officer; the role is a useful model at any level of government.',
                 co: 'Name one executive as accountable for AI use across the company, with a written mandate, a small budget and a standing item at leadership meetings.' } }
      ] },
    { id: 'appr', title: 'Approvals before go-live',
      why: 'Most AI problems are cheapest to stop before launch. The trick is proportion: small tools get a quick check, and anything that shapes decisions about people gets a proper review.',
      qs: [
        { ctl: 'Approval gate', crit: true,
          t: 'Before a new AI system or AI feature goes live, does it have to pass a formal approval step?',
          o: ['No — teams switch things on as they like', 'Only large IT projects are reviewed', 'There is an approval step, but small or free tools often skip it', 'Every system, including pilots and free tools, goes through a proportionate approval'],
          act: 'Set up a one-page approval form (purpose, data, who is affected, which laws and sector rules apply, risk tier, owner, human review, switch-off plan). Light-touch sign-off for low-risk tools; full review for anything that affects decisions about people.' },
        { ctl: 'Impact assessment', crit: true,
          t: { pub: 'Before using AI that affects decisions about people, do you assess the impact on their rights, fairness and privacy?',
               co: 'Before using AI that affects decisions about customers, applicants or staff, do you assess the impact on fairness and privacy?' },
          hint: { pub: 'Under the EU AI Act, bodies governed by public law that deploy high-risk AI must carry out a fundamental rights impact assessment (Article 27), alongside any data protection impact assessment.',
                  co: 'Where personal data is involved, a data protection impact assessment may already be required. Some private deployers of high-risk AI under the EU AI Act (for example in credit scoring or life and health insurance) must also assess fundamental rights impact.' },
          o: ['Never', 'Only a data-protection check', 'An impact assessment for some higher-risk uses', 'A documented risk tiering, with a full impact assessment and sign-off for higher-risk uses'],
          act: { pub: 'Add a short risk-tiering step to approval. For any system that affects eligibility, enforcement, benefits, services or staff, complete an impact assessment covering who is affected, possible harms, mitigations and human oversight. Check whether the EU AI Act fundamental rights impact assessment applies.',
                 co: 'Add a short risk-tiering step to approval. For any system that affects hiring, pay, credit, pricing or access to services, complete an impact assessment covering who is affected, possible harms, mitigations and human oversight.' } },
        { ctl: 'Staff AI-use rules', crit: false,
          t: 'Is there a written rule on what staff may use general AI tools (chatbots, copilots) for, and what data must never go into them?',
          o: ['No rule', 'Informal guidance only', 'A written policy that few people know about', 'A written policy, with approved tools provided and staff walked through it'],
          act: { pub: 'Write a one-page rule: approved tools, data that must never go in (personal data of residents, case files, classified or sensitive material), when outputs must be checked, and who to ask. Provide an approved tool so staff aren’t pushed onto personal accounts.',
                 co: 'Write a one-page rule: approved tools, data that must never go in (customer details, financials, anything under NDA), when outputs must be checked, and who to ask. Provide an approved business account so staff aren’t pushed onto personal ones.' } },
        { ctl: 'Telling people it is AI', crit: false,

          hint: 'EU AI Act Article 50 sets transparency duties for chatbots, deepfakes and some AI-generated text, which have applied since 2 August 2026.',
          o: ['Not considered', 'Left to each team', 'Decided for public-facing chatbots only', 'A standard rule for disclosure and labelling, applied at approval'],
          act: 'Add a disclosure line to the approval form: will people interact with AI or see AI-generated content, and how will they be told? Use one plain standard wording across services.' }
      ] },
    { id: 'proc', title: 'Procurement and vendor terms',
      why: { pub: 'Most public-sector AI is bought, not built. The contract is where you get the information, rights and way out you’ll need to oversee a system you don’t control.',
             co: 'Most company AI is bought, not built. The contract is where you get the information, rights and way out you’ll need to oversee a system you don’t control.' },
      qs: [
        { ctl: 'AI procurement questions', crit: false,
          t: 'When you buy AI, or software with AI inside, do your procurement questions cover how the AI works, how it was tested and what data it uses?',

          act: 'Add a standard AI annex to procurement: intended purpose, known limitations, test results on comparable cases, training-data sources, human-oversight features, and the vendor\'s own risk classification. Apply it to renewals too, since AI features often arrive in updates.' },
        { ctl: 'Data-use terms', crit: true,

    { id: 'eval', title: 'Evaluation and testing',

    { id: 'log', title: 'Logging and records',

          o: ['No logs we can access', 'The vendor holds logs, but we can’t easily get them', 'Logs kept for the main systems', 'Logs for every material system, kept for a defined period and searchable'],

        { ctl: 'Decision reconstruction', crit: false,

    $$('[data-why]').forEach(function (el) { el.textContent = tx(AREAS[+el.getAttribute('data-why')].why); });
    $$('[data-qt]').forEach(function (el) { var p = el.getAttribute('data-qt').split('-'); el.textContent = tx(AREAS[+p[0]].qs[+p[1]].t); });
    $$('[data-qh]').forEach(function (el) { var p = el.getAttribute('data-qh').split('-'); el.textContent = tx(AREAS[+p[0]].qs[+p[1]].hint); });
  }

  var shell = '<div class="aic-col">' + intro() + AREAS.map(function (_, i) { return areaScreen(i); }).join('') +
    '<div class="aic-progresswrap aic-noprint" hidden><div class="aic-progress" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div></div>' +
    '<section class="aic-screen" data-screen="results" aria-labelledby="aic-gov-rh" hidden></section></div>';
  ROOT.innerHTML = shell;
  applyOrgText();
  $$('[role="radiogroup"]').forEach(rovingTabs);

  /* ---------- Interaction ---------- */
  function key(a, q) { return a + '-' + q; }
  function areaDone(ai) { return AREAS[ai].qs.every(function (_, qi) { return state.answers[key(ai, qi)] !== undefined; }); }
  function refreshNav(ai) {
    var scr = $('[data-screen="' + ai + '"]');
    var answered = AREAS[ai].qs.filter(function (_, qi) { return state.answers[key(ai, qi)] !== undefined; }).length;
    $('[data-nav="next"]', scr).disabled = !areaDone(ai);
    $('[data-hint="' + ai + '"]', scr).textContent = answered + ' of ' + AREAS[ai].qs.length + ' answered';
  }
  function progress() {
    var pct = Math.round(Object.keys(state.answers).length / TOTAL_Q * 100);
    var bar = $('.aic-progress');
    bar.setAttribute('aria-valuenow', pct);
    bar.firstChild.style.width = pct + '%';
  }
  function select(opt) {
    var group = opt.closest('[role="radiogroup"]');
    $$('[role="radio"]', group).forEach(function (o) { o.setAttribute('aria-checked', o === opt ? 'true' : 'false'); });
    rovingTabs(group);
    if (opt.hasAttribute('data-org')) {
      state.org = opt.getAttribute('data-org');
      applyOrgText();
      return;
    }
    if (opt.hasAttribute('data-scale')) {
      state.scale = opt.getAttribute('data-scale');
      $('#aic-gov-start').disabled = false;
      $('#aic-gov-starthint').textContent = 'About 6 minutes';
      return;
    }
    var ai = +opt.getAttribute('data-a'), qi = +opt.getAttribute('data-q'), v = opt.getAttribute('data-v');
    state.answers[key(ai, qi)] = v === 'u' ? 'u' : +v;
    refreshNav(ai); progress();
  }
  function show(id) {
    $$('.aic-screen').forEach(function (s) { s.hidden = s.getAttribute('data-screen') !== String(id); });
    $('.aic-progresswrap').hidden = (id === 'intro' || id === 'results');
    state.screen = id;
    var scr = $('[data-screen="' + id + '"]');
    if (id === 'results') renderResults();
    scrollToEl(ROOT);
    focusHeading($('h1,h2', scr));
  }

  ROOT.addEventListener('click', function (e) {
    var opt = e.target.closest('[role="radio"]');
    if (opt && ROOT.contains(opt)) { select(opt); return; }
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      var cur = state.screen;
      if (nav.getAttribute('data-nav') === 'back') show(cur === 0 ? 'intro' : cur - 1);
      else if (areaDone(cur)) show(cur === AREAS.length - 1 ? 'results' : cur + 1);
      return;
    }
    if (e.target.closest('#aic-gov-start')) {
      if (!state.started) { state.started = true; emit('tool_started', { org_type: state.org, ai_use: state.scale }); }
      show(0);
      return;
    }
    if (e.target.closest('[data-act="print"]')) { window.print(); return; }
    if (e.target.closest('[data-act="restart"]')) {
      state.answers = {}; state.started = false;
      $$('.aic-opt[data-a]').forEach(function (o) { o.setAttribute('aria-checked', 'false'); });
      $$('[role="radiogroup"]').forEach(rovingTabs);
      AREAS.forEach(function (_, i) { refreshNav(i); });
      progress(); show('intro');
      return;
    }
    var f = e.target.closest('[data-filter]');
    if (f) {
      var val = f.getAttribute('data-filter');
      $$('[data-filter]').forEach(function (b) { b.setAttribute('aria-pressed', b === f ? 'true' : 'false'); });
      var anyTodo = false;
      $$('.aic-ctl').forEach(function (row) {
        var todo = row.getAttribute('data-status') !== 'in';
        if (todo) anyTodo = true;
        row.hidden = !(val === 'all' || todo);
      });
      var empty = $('.aic-ctl-empty');
      if (empty) empty.hidden = val === 'all' || anyTodo;
    }
  });
  radioKeys(ROOT, select);
  AREAS.forEach(function (_, i) { refreshNav(i); });

  /* ---------- Scoring ---------- */
  function statusOf(v) {
    if (v === 'u') return { id: 'unk', label: 'Not known', tone: 'warn', rank: 1 };
    if (v === 3) return { id: 'in', label: 'In place', tone: 'good', rank: 4 };
    if (v === 2) return { id: 'part', label: 'Partly in place', tone: 'blue', rank: 3 };
    if (v === 1) return { id: 'weak', label: 'Weak', tone: 'warn', rank: 2 };
    return { id: 'miss', label: 'Missing', tone: 'bad', rank: 0 };
  }
  function compute() {
    var controls = [], areas = [];
    AREAS.forEach(function (a, ai) {
      var pts = 0;
      a.qs.forEach(function (q, qi) {
        var v = state.answers[key(ai, qi)];
        var num = v === 'u' ? 0 : v;
        pts += num;
        var st = statusOf(v);
        /* priority: lower is more urgent. critical controls first, unknown treated like missing for critical ones */
        var pr = (st.id === 'miss' ? 0 : st.id === 'unk' ? 1 : st.id === 'weak' ? 2 : st.id === 'part' ? 4 : 9) - (q.crit ? 0.5 : 0);
        controls.push({ ai: ai, qi: qi, q: q, v: v, st: st, pr: pr, area: a.title });
      });
      areas.push({ ai: ai, title: a.title, pct: Math.round(pts / (a.qs.length * 3) * 100), unknown: a.qs.filter(function (_, qi) { return state.answers[key(ai, qi)] === 'u'; }).length });
    });
    var total = controls.reduce(function (n, c) { return n + (c.v === 'u' ? 0 : c.v); }, 0);
    var score = Math.round(total / (TOTAL_Q * 3) * 100);
    var level = LEVELS.filter(function (l) { return score <= l.max; })[0];
    var gaps = controls.filter(function (c) { return c.pr < 4; }).sort(function (x, y) { return x.pr - y.pr || x.ai - y.ai; }).slice(0, 3);
    var unknown = controls.filter(function (c) { return c.v === 'u'; }).length;
    return { controls: controls, areas: areas, score: score, level: level, gaps: gaps, unknown: unknown };
  }

  function scaleAdvice(r) {
    if (state.scale === 'light') return 'You told us AI here is mostly general tools, with nothing shaping decisions about people. You don’t need a heavy framework yet. A one-page version of these controls is enough: the inventory, staff AI-use rules, data terms with vendors, and a named owner. Revisit this check before AI starts touching decisions about ' + (state.org === 'pub' ? 'residents' : 'customers or staff') + '.';
    if (state.scale === 'heavy') return 'You told us AI shapes core services or decisions about people. At that level, every control below matters, and gaps in approval, human review, logging and switch-off are the ones regulators, auditors and courts will ask about first.' + (state.org === 'pub' ? ' Several of these uses may be high-risk under the EU AI Act if you operate in the EU.' : '');
    return 'You told us several systems are in use and some affect people. Focus first on the systems that affect people: give them the full set of controls, and keep lighter rules for general productivity tools.';
  }

  function solutionReason(r) {
    var weakest = r.areas.slice().sort(function (a, b) { return a.pct - b.pct; })[0];
    if (r.score > 80) return 'An outside adviser can stress-test controls that look good on paper, for example by running an incident or switch-off exercise with your team.';
    return 'Your weakest area is ' + weakest.title.toLowerCase() + ' (' + weakest.pct + '%). A governance adviser from the LLPA network can help you put those controls in place without building a bureaucracy around them.';
  }

  function contextualStep(r) {
    var g = r.gaps[0];
    if (!g) return { title: 'Rehearse the bad day', body: 'Your controls look solid. Next, test them: take one system and walk through a realistic failure with the owner, the reviewer and whoever holds the off-switch. Note what slowed you down.' };
    return { title: 'This week: ' + g.q.ctl.toLowerCase(), body: tx(g.q.act) };
  }

  function renderResults() {
    var r = compute();
    var resultInfo = { label: r.level.label, score: r.score, lead_type: 'assessment' };
    var host = $('[data-screen="results"]');
    var ring = 2 * Math.PI * 52;
    var html = '<div class="aic-fade">' +
      '<span class="aic-eyebrow">Where you stand · ' + (state.org === 'pub' ? 'public body' : 'company') + ' edition</span>' +
      '<h2 class="aic-h2" id="aic-gov-rh">' + esc(r.level.label) + '</h2>' +
      '<div class="aic-card aic-gov-score">' +
        '<div class="aic-gov-dial" role="img" aria-label="Governance controls score ' + r.score + ' out of 100">' +
          '<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="aic-gov-track"/><circle cx="60" cy="60" r="52" class="aic-gov-arc aic-tone-' + r.level.tone + '" style="stroke-dasharray:' + ring.toFixed(1) + ';stroke-dashoffset:' + (ring * (1 - r.score / 100)).toFixed(1) + '"/></svg>' +
          '<div class="aic-gov-num"><b>' + r.score + '</b><span>of 100</span></div></div>' +
        '<div><p>' + esc(r.level.desc) + '</p><p class="aic-small" style="margin-top:10px">' + esc(scaleAdvice(r)) + '</p>' +
        (r.unknown ? '<p class="aic-note aic-warn" style="margin-top:12px"><strong>' + r.unknown + ' answer' + (r.unknown > 1 ? 's were' : ' was') + ' "Not sure".</strong> They score zero here. If nobody knows whether a control exists, it probably doesn’t work in practice, so finding out is the first action for each.</p>' : '') +
        '</div></div>' +

      '<div class="aic-card" style="margin-top:14px"><span class="aic-eyebrow">By area</span><div class="aic-bars" style="margin-top:8px">' +
      r.areas.map(function (a) {
        var cls = a.pct < 40 ? 'aic-low' : a.pct < 70 ? 'aic-mid' : '';
        return '<div class="aic-bar-row"><span class="aic-bar-label">' + esc(a.title) + (a.unknown ? ' <span class="aic-small">(' + a.unknown + ' not sure)</span>' : '') + '</span>' +
          '<span class="aic-bar" role="img" aria-label="' + esc(a.title) + ': ' + a.pct + ' percent"><i class="' + cls + '" data-w="' + a.pct + '"></i></span><span class="aic-bar-pct">' + a.pct + '%</span></div>';
      }).join('') + '</div></div>';

    html += '<div style="margin-top:28px"><span class="aic-eyebrow">Your top gaps</span><h3 class="aic-h2" style="font-size:26px">Close these first</h3>';
    if (!r.gaps.length) html += '<p class="aic-soft">No control is missing or weak. Every gap left is about tightening what exists; see the action list below.</p>';
    else html += '<ol class="aic-gaps">' + r.gaps.map(function (g, i) {
      return '<li class="aic-card"><span class="aic-gap-n" aria-hidden="true">' + (i + 1) + '</span><div><div class="aic-qnum">' + esc(g.area) + (g.q.crit ? ' · core control' : '') + '</div><h4 class="aic-h3">' + esc(g.q.ctl) + ' <span class="aic-tag aic-t-' + g.st.tone + '">' + g.st.label + '</span></h4><p class="aic-soft">' + esc(tx(g.q.act)) + '</p></div></li>';
    }).join('') + '</ol>';
    html += '</div>';

    var sorted = r.controls.slice().sort(function (x, y) { return x.pr - y.pr || x.ai - y.ai || x.qi - y.qi; });
    html += '<div style="margin-top:28px"><span class="aic-eyebrow">Control-by-control action list</span><h3 class="aic-h2" style="font-size:26px">All ' + TOTAL_Q + ' controls, most urgent first</h3>' +
      '<div class="aic-actions aic-noprint" style="margin:8px 0 12px"><div class="aic-seg" role="group" aria-label="Filter controls"><button type="button" data-filter="todo" aria-pressed="true">Needs action</button><button type="button" data-filter="all" aria-pressed="false">All controls</button></div></div>' +
      '<div class="aic-card aic-ctllist">' + sorted.map(function (c) {
        var done = c.st.id === 'in';
        return '<div class="aic-ctl" data-status="' + c.st.id + '"' + (done ? ' hidden' : '') + '>' +
          '<div class="aic-ctl-head"><span class="aic-tag aic-t-' + c.st.tone + '">' + c.st.label + '</span><b>' + esc(c.q.ctl) + '</b><span class="aic-small">' + esc(c.area) + '</span></div>' +
          '<p class="aic-small"><b>Good looks like:</b> ' + esc(c.q.o[3]) + '.</p>' +
          (done ? '<p class="aic-small"><b>Keep it working:</b> test it at least once a year and record the result.</p>' :
            '<p><b>' + (c.st.id === 'unk' ? 'First find out, then: ' : 'Action: ') + '</b>' + esc(tx(c.q.act)) + '</p>') +
          '</div>';
      }).join('') + '<p class="aic-small aic-ctl-empty" ' + (sorted.some(function (c) { return c.st.id !== 'in'; }) ? 'hidden' : '') + '>Every control is in place. Switch to "All controls" to see them.</p></div></div>';

    var step = contextualStep(r);
    html += '<div style="margin-top:28px" class="aic-next">' +
      '<div class="aic-card"><span class="aic-eyebrow">Your next step</span><h3 class="aic-h3">' + esc(step.title) + '</h3><p class="aic-soft">' + esc(step.body) + '</p>' +
        '<button type="button" class="aic-btn aic-noprint" data-act="print">Print or save the action list</button></div>' +
      '<div class="aic-card aic-solution"><span class="aic-eyebrow">Need more than an answer?</span><h3 class="aic-h3">Get matched to a governance adviser</h3><p class="aic-soft">' + esc(solutionReason(r)) + '</p>' +
        '<a class="aic-btn aic-btn-primary aic-noprint" data-aic-cta="get_matched" data-aic-url="matchUrl" target="_blank" rel="noopener">Get matched to someone</a></div>' +
      '</div>' +
      '<div class="aic-handoff aic-noprint"><a data-aic-cta="email_results" data-aic-url="resultsFormUrl" target="_blank" rel="noopener">Email me my results</a>' +
      '<a data-aic-cta="newsletter" data-aic-url="newsletterUrl" target="_blank" rel="noopener">Newsletter: keep up without keeping up with everything</a>' +
      '<button type="button" class="aic-linkbtn" data-act="restart">Start again</button></div>';

    html += '<div class="aic-card" style="margin-top:22px"><span class="aic-eyebrow">Worth doing whatever your score</span><ul class="aic-list" style="margin-top:8px">' +
      '<li><b>Keep the inventory alive.</b> It is the control every other control depends on.</li>' +
      '<li><b>Build AI literacy.</b> Staff who know when not to trust AI are the cheapest safeguard you have.</li>' +
      '<li><b>Rehearse one bad day a year.</b> A short tabletop exercise tests ownership, escalation and switch-off together.</li>' +
      '<li><b>Write it down in plain language.</b> ' + (state.org === 'pub' ? 'Public trust depends on residents being able to see what AI you use and why.' : 'Customers and staff trust what they can see and question.') + '</li></ul></div>';

    html += '<div class="aic-sources" style="margin-top:18px"><p><b>About this check.</b> The questions draw on common public-sector and corporate AI governance practice, including the EU AI Act (Regulation (EU) 2024/1689) deployer duties in Articles 4, 26, 27 and 50, US OMB memoranda M-25-21 and M-25-22 on federal AI use and acquisition (April 2025), the UK Algorithmic Transparency Recording Standard, and the OECD\'s work on governing with AI. Legal references are as of November 2026. The EU amended some AI Act dates in July 2026 (Regulation (EU) 2026/1744 moved high-risk duties to December 2027 and August 2028), so check the official text. ' +
      'This is a self-assessment, not an audit, legal advice or a certification. The scoring is a rough guide — use it to start a conversation, not to settle one.</p></div>';
    html += '</div>';
    host.innerHTML = html;
    wireCtas(host, resultInfo);
    var fills = $$('.aic-bar i', host);
    function setW() { fills.forEach(function (f) { f.style.width = f.getAttribute('data-w') + '%'; }); }
    if (reducedMotion) setW(); else requestAnimationFrame(function () { requestAnimationFrame(setW); });
    emit('tool_completed', { assessment_result: r.level.label, score: r.score, org_type: state.org, ai_use: state.scale });
    emit('result_viewed', { assessment_result: r.level.label, score: r.score });
  }

})();
</script>
<!-- ===== AIC:END ===== -->
</body>
</html>
