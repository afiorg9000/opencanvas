[build]
  # The board is exported on your computer (npm run export-board) and committed,
  # because data/canvas.db never leaves your machine.
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/api/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shop-link previews for the published site, which has no Express API.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
